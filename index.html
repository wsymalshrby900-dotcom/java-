
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلات المجد - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">

        <div class="store-logo">
            <div class="logo-icon">✦</div>
            <h1>محلات المجد</h1>
            <p>للكهرباء والأدوات المنزلية</p>
        </div>

        <div class="login-box">
            <h2>مرحباً بك</h2>
            <p>يرجى إدخال بياناتك للدخول إلى المتجر</p>

            <form id="loginForm">

                <label>الاسم الكامل</label>
                <input type="text" id="customerName"
                       placeholder="أدخل اسمك الكامل" required>

                <label>رقم الهاتف</label>
                <input type="tel" id="customerPhone"
                       placeholder="أدخل رقم هاتفك" required>

                <button type="submit">الدخول إلى المتجر</button>

            </form>

            <div id="errorMessage"></div>
        </div>

        <footer>
            أهلاً وسهلاً بكم في محلات المجد
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
